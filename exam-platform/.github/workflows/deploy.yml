name: test-and-deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: API tests
        working-directory: api
        run: npm ci && npm test
      - name: Worker tests
        working-directory: workers
        run: npm ci && npm test
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.14.1, terraform_wrapper: false }
      - name: Terraform format and validate
        working-directory: infra
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  deploy:
    needs: test
    # Deploy only runs once the repo variable DEPLOY_ENABLED is set to true (and the AWS secrets exist).
    # Without it, pushes still run the tests and the Terraform checks.
    if: github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      # Deploy credentials stored as repository secrets (AWS_SESSION_TOKEN only for temporary credentials).
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
      TF_VAR_hosted_zone_id: ${{ vars.HOSTED_ZONE_ID }}
      TF_VAR_ses_sender_email: ${{ vars.SES_SENDER_EMAIL }}
      TF_VAR_alarm_email: ${{ vars.ALARM_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.14.1, terraform_wrapper: false }

      - name: Terraform state bucket
        run: echo "STATE_BUCKET=$(scripts/bootstrap-state.sh)" >> "$GITHUB_ENV"

      - name: Package workers (dependencies + RDS CA bundle)
        run: |
          cd workers && npm ci --omit=dev
          curl -fsSL https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem -o rds-ca.pem

      - name: Terraform init
        run: |
          terraform -chdir=infra init -input=false \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=exam-platform/terraform.tfstate" \
            -backend-config="region=$AWS_REGION"

      - name: Create the container registry (first run only does real work)
        run: scripts/tf-apply.sh -target=aws_ecr_repository.api

      - name: Build and push the API image
        run: |
          REPO=$(terraform -chdir=infra output -raw ecr_repository_url)
          aws ecr get-login-password | docker login --username AWS --password-stdin "${REPO%%/*}"
          docker build -t "$REPO:$GITHUB_SHA" api
          docker push "$REPO:$GITHUB_SHA"

      - name: Terraform apply (new image tag = rolling redeploy)
        run: scripts/tf-apply.sh -var "image_tag=$GITHUB_SHA"

      - name: Wait for the new tasks to be healthy
        run: |
          aws ecs wait services-stable \
            --cluster "$(terraform -chdir=infra output -raw ecs_cluster)" \
            --services "$(terraform -chdir=infra output -raw ecs_service)"

      - name: Publish the frontend
        run: scripts/publish-frontend.sh

      - name: Smoke test through CloudFront
        run: |
          SITE=$(terraform -chdir=infra output -raw site_url)
          test "$(curl -s -o /dev/null -w '%{http_code}' "$SITE/")" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$SITE/api/me")" = "401"   # reaches the API through CloudFront; no token
          echo "site and API are up: $SITE"
